{% extends "base.html" %}

{% block title %}Code SMS{% endblock %}

{% block content %}
<section class="container page-wrap form-narrow">
  <h1 class="page-title">Vérification SMS</h1>
  <p class="muted">Un code a été envoyé au {{ telephone }}.</p>
  <form method="post" class="form-panel">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="code">Code OTP</label>
      <input class="form-control form-control-lg text-center" id="code" name="code" required inputmode="numeric" autocomplete="one-time-code">
    </div>
    <button class="btn-cta w-100" type="submit">Valider</button>
  </form>
  <p class="small mt-3"><a href="{% url 'accounts:login' %}">Modifier le numéro</a></p>
</section>
{% endblock %}
