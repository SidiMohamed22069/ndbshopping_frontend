{% extends "base.html" %}

{% block title %}Livraison{% endblock %}

{% block content %}
<section class="container page-wrap form-narrow">
  <h1 class="page-title">Finaliser la commande</h1>
  <p class="muted">Choisissez la ville de livraison et précisez l'adresse. Le paiement se fait à la livraison.</p>
  <form method="post" class="form-panel">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="villeLivraison">Ville</label>
      <select class="form-select" id="villeLivraison" name="villeLivraison" required>
        <option value="">— Choisir —</option>
        {% for code, label in cities %}
          <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="adresseDetails">Adresse / précisions</label>
      <textarea class="form-control" id="adresseDetails" name="adresseDetails" rows="3" required></textarea>
    </div>
    <button class="btn-cta w-100" type="submit">Confirmer la commande</button>
  </form>
</section>
{% endblock %}
