{% load i18n ndb_tags %}
{% if featured_publications %}
<section class="promo-banner" aria-label="{% trans 'Annonces' %}">
  <div id="promoCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000" data-bs-touch="true" data-bs-pause="hover">
    <div class="carousel-inner">
      {% for pub in featured_publications %}
        <div class="carousel-item{% if forloop.first %} active{% endif %}">
          <a class="promo-banner-link" href="{% url 'catalog:publication_detail' pub.id %}">
            {% if pub.imageUrl %}
              <img src="{{ pub.imageUrl|media_url }}" alt="">
            {% endif %}
            <span class="promo-banner-title">{{ pub.titre }}</span>
          </a>
        </div>
      {% endfor %}
    </div>
    {% if featured_publications|length > 1 %}
      <button class="carousel-control-prev" type="button" data-bs-target="#promoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">{% trans "Annonce précédente" %}</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#promoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">{% trans "Annonce suivante" %}</span>
      </button>
    {% endif %}
  </div>
</section>
{% endif %}
