{% extends "base_admin.html" %}

{% block title %}{% if publication %}Modifier{% else %}Nouvelle{% endif %} publication{% endblock %}

{% block content %}
<h1 class="h4 mb-3">{% if publication %}Modifier{% else %}Nouvelle publication{% endif %}</h1>
<form method="post" class="form-panel form-narrow-lg">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="titre">Titre</label>
    <input class="form-control" id="titre" name="titre" required value="{{ publication.titre }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="contenu">Contenu</label>
    <textarea class="form-control" id="contenu" name="contenu" rows="8" required>{{ publication.contenu }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label" for="imageUrl">URL d'image</label>
    <input class="form-control" id="imageUrl" name="imageUrl" value="{{ publication.imageUrl }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="produitLieId">ID produit lié (optionnel)</label>
    <input class="form-control" id="produitLieId" name="produitLieId" type="number" min="1" value="{{ publication.produitLieId }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="statut">Statut</label>
    <select class="form-select" id="statut" name="statut">
      {% for code, label in statuses %}
        <option value="{{ code }}" {% if publication.statut == code %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn-cta" type="submit">Enregistrer</button>
  <a class="btn btn-link" href="{% url 'adminpanel:publication_list' %}">Annuler</a>
</form>
{% endblock %}
